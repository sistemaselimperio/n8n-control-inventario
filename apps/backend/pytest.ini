[pytest]
# Raiz de imports: "app" y "tests" se resuelven desde apps/backend.
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: requiere un Postgres real indicado en TEST_DATABASE_URL (en CI corre contra un contenedor); sin esa variable se omite.
filterwarnings =
    ignore::DeprecationWarning
